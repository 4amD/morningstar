<!DOCTYPE html>
<html lang="en">
<head>

<title>Chirp Chase</title>
<style>

  #pad { display: none; position: fixed; left: 0; right: 0; bottom: 10px; padding: 0 14px;
         justify-content: space-between; pointer-events: none; }
  #pad > * { pointer-events: auto; }
  #pad button { width: 76px; height: 76px; margin-right: 10px; border-radius: 18px; border: 2px solid rgba(255,255,255,.4);
         background: rgba(255,255,255,.16); color: #fff; font: bold 26px "Courier New", monospace;
         touch-action: none; user-select: none; -webkit-user-select: none; }
  #pad button[data-k="jump"] { width: 110px; margin-right: 0; font-size: 20px; }
  @media (pointer: coarse) { #pad { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="pad">
  <div><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
  <button data-k="jump">JUMP</button>
</div>

<script>
(() => {
'use strict';

// ---------- setup ----------
const VW = 800, VH = 450, WW = 1600;          // view size, world width
const G = 1800, MOVE = 230, JUMP = -640, STEP = 1 / 60;
const CAT_JUMP = -650, CAT_AIR = 150, ROAM = 70;
let CHASE = 165;
const cv = document.getElementById('c'), cx = cv.getContext('2d');
cv.width = VW; cv.height = VH;

// one-way platforms: x = left, y = top surface, w = width. index 0 = ground
const PLATS = [{ x: 0, y: 410, w: WW }];
[[320, [[40,180],[300,200],[580,180],[860,200],[1140,180],[1400,160]]],
 [230, [[170,180],[450,200],[730,180],[1010,200],[1290,200]]],
 [140, [[40,200],[330,180],[620,200],[900,180],[1180,200],[1440,140]]]]
  .forEach(([y, row]) => row.forEach(([x, w]) => PLATS.push({ x, y, w })));
PLATS.forEach((p, i) => { p.i = i; p.crumble = false; p.stand = 0; p.gone = false; p.goneT = 0; });
const DOOR = { x: 100, y: 140, w: 36, h: 50 };

// ---------- themes (one per level) ----------
// wall/da/db = wallpaper, dot = accent, band/trim/pan = wainscot, sky = window gradient,
// cur = curtains, frame = pictures, pt/pm/pl = platform top/mid/low, gd/gs = ground, pat = wallpaper pattern
const TH = [
  { wall:'#4b2a5e', da:'#583272', db:'#41234f', dot:'#e8b04a', band:'#2c1640', trim:'#e8b04a', pan:'#3a2150', sky:['#ffb86b','#ff6f91','#8a4fff'], cur:'#c2467a', cur2:'#9c2f60', frame:'#e8b04a', pt:'#5ee08a', pm:'#35a863', pl:'#237a49', gd:'#3a2447', gs:'#4a2f5a', pat:0, acc:'#8a4fff', txt:'#fff3a0' },
  { wall:'#2f6f73', da:'#3a8286', db:'#245a5e', dot:'#ffe08a', band:'#173d40', trim:'#ffe08a', pan:'#1f4c50', sky:['#ffe9a8','#ffb86b','#ff8a5b'], cur:'#e0503a', cur2:'#b03a28', frame:'#ffe08a', pt:'#ffd166', pm:'#e09f3e', pl:'#b07a2a', gd:'#2a3d40', gs:'#35505a', pat:3, acc:'#ffd166', txt:'#fff3c0' },
  { wall:'#2d6b3a', da:'#37804a', db:'#245630', dot:'#f7e07a', band:'#173e22', trim:'#f7e07a', pan:'#1f4d2b', sky:['#d8f2ff','#9bdcff','#6bbf59'], cur:'#e86fa8', cur2:'#b94882', frame:'#c98a4a', pt:'#f4a6c8', pm:'#d6709f', pl:'#a34878', gd:'#2c4a2a', gs:'#3a5f35', pat:1, acc:'#ff9ec7', txt:'#fffbc4' },
  { wall:'#3d4663', da:'#4a5578', db:'#2f3750', dot:'#9fb4ff', band:'#222a40', trim:'#9fb4ff', pan:'#2a3250', sky:['#7f8fb5','#5a6a95','#3a4570'], cur:'#6a7bb0', cur2:'#4c5c8e', frame:'#9fb4ff', pt:'#8fd3ff', pm:'#5aa4d6', pl:'#3a78a8', gd:'#252b44', gs:'#313a5a', pat:2, acc:'#8fd3ff', txt:'#e3f0ff' },
  { wall:'#5a3a22', da:'#6b4629', db:'#47301c', dot:'#ffb347', band:'#33200f', trim:'#ffb347', pan:'#402a16', sky:['#ffcf7a','#ff9a3c','#c0561f'], cur:'#a8472a', cur2:'#7c321c', frame:'#ffb347', pt:'#e0a96d', pm:'#b27a3e', pl:'#7f5226', gd:'#2e1f12', gs:'#3c2917', pat:2, acc:'#ffb347', txt:'#ffe8c2' },
  { wall:'#2b4f7a', da:'#35608f', db:'#223f64', dot:'#e6fbff', band:'#17314f', trim:'#bfefff', pan:'#1d3a5c', sky:['#e6fbff','#9fe0ff','#5aa8ff'], cur:'#7fd0ff', cur2:'#4fa6d8', frame:'#bfefff', pt:'#e6fbff', pm:'#9fd8f0', pl:'#6aaed0', gd:'#18304a', gs:'#23405f', pat:0, acc:'#9fe8ff', txt:'#f0fcff', stars:true },
  { wall:'#15201c', da:'#1c2d26', db:'#101916', dot:'#39ff88', band:'#0b1210', trim:'#39ff88', pan:'#111c18', sky:['#0a3d2b','#08281d','#041510'], cur:'#0f5a3c', cur2:'#0a3d29', frame:'#39ff88', pt:'#39ff88', pm:'#1fae5a', pl:'#146e3a', gd:'#0d1512', gs:'#16221d', pat:3, acc:'#39ff88', txt:'#c8ffd9', stars:true },
  { wall:'#3f7fb0', da:'#4a90c4', db:'#336a96', dot:'#ffffff', band:'#27567a', trim:'#ffffff', pan:'#2f6590', sky:['#fff2c2','#ffd1a0','#ff9fb0'], cur:'#f0f6ff', cur2:'#c7d8ee', frame:'#ffffff', pt:'#ffd6e0', pm:'#ff9fb8', pl:'#d6607f', gd:'#2a5578', gs:'#356690', pat:1, acc:'#ffffff', txt:'#ffffff' },
  { wall:'#3f4a22', da:'#4d5a2a', db:'#323c1a', dot:'#c4e86a', band:'#232a12', trim:'#c4e86a', pan:'#2c3517', sky:['#dfe99a','#a4c24a','#5c7f2c'], cur:'#6f7f2e', cur2:'#566320', frame:'#c4e86a', pt:'#a8d65a', pm:'#6fa03a', pl:'#4a7226', gd:'#2a2f14', gs:'#363d1a', pat:2, acc:'#c4e86a', txt:'#f1ffc4' },
  { wall:'#1b1033', da:'#26164a', db:'#130a26', dot:'#ff4d9a', band:'#0e0720', trim:'#ff4d9a', pan:'#180e30', sky:['#3b1a6e','#1b0f3d','#0a0520'], cur:'#7a1f5c', cur2:'#541442', frame:'#ff4d9a', pt:'#ff6bd6', pm:'#b43fa0', pl:'#7a2a74', gd:'#10081f', gs:'#1a0e30', pat:0, acc:'#ff4d9a', txt:'#ffd1ec', stars:true }
];

// ---------- levels ----------
// chicks: platform index, or [platform index, x]. cats: seconds into the round when each cat appears.
// hazards: spike / ball (rolling yarn) / drop (falling water) / laser. flags: crumble, ice, wind, mud, dark.
const sp = (p, a, b) => ({ t: 'spike', p, a, b });
const ball = (p, a, b, v, x0) => ({ t: 'ball', p, a, b, v, x: x0 === undefined ? (a + b) / 2 : x0, d: 1 });
const drop = (p, x, per, ph) => ({ t: 'drop', p, x, per, ph });
const laser = (p, x, per, on, ph) => ({ t: 'laser', p, x, per, on, ph });
const LEVELS = [
  { name: 'LIVING ROOM', desc: 'GRAB CHICKS > RUN TO EXIT > DODGE THE CAT',
    time: 90, chicks: [3, 6, 9], cats: [18], catSpd: 130, haz: [] },
  { name: 'KITCHEN', desc: 'SHARP SPIKES ON THE FLOOR AND SHELVES',
    time: 100, chicks: [3, 6, 9, 11], cats: [12, 50], catSpd: 140,
    haz: [sp(0, 640, 700), sp(0, 1000, 1060), sp(0, 1240, 1300), sp(2, 380, 420), sp(4, 930, 990), sp(8, 520, 570), sp(10, 1100, 1150)] },
  { name: 'YARN YARD', desc: 'JUMP OVER THE ROLLING YARN BALLS',
    time: 110, chicks: [3, 6, 9, 11, 15], cats: [10, 50], catSpd: 150,
    haz: [ball(0, 150, 1550, 140, 900), ball(4, 870, 1050, 90), ball(10, 1020, 1200, 100), ball(2, 310, 490, 90)] },
  { name: 'RAINY ATTIC', desc: 'WATCH THE SHADOW - DRIPS FALL AFTER IT FLASHES',
    time: 115, chicks: [3, 6, 9, 11, 15, [0, 1500]], cats: [10, 45], catSpd: 150,
    haz: [drop(0, 700, 3.4, 0), drop(2, 400, 3, 0.7), drop(4, 960, 3.2, 1.4), drop(8, 550, 2.8, 0.3), drop(10, 1110, 3, 1.1),
          drop(5, 1230, 3.3, 2), drop(14, 720, 2.9, 0.5), drop(16, 1280, 3.1, 1.8), drop(0, 1100, 3.5, 2.2), drop(13, 420, 3, 1.5)] },
  { name: 'CRUMBLY CELLAR', desc: 'CRACKED SHELVES FALL AWAY - DO NOT STAY LONG',
    time: 120, chicks: [3, 6, 9, 11, 17, [0, 1500]], cats: [10, 40, 70], catSpd: 155,
    crumble: [2, 4, 5, 8, 10, 13, 15, 16], haz: [ball(0, 150, 1550, 120, 1300)] },
  { name: 'ICE CAVE', desc: 'SLIPPERY FLOORS AND SHARP ICICLES',
    time: 125, chicks: [3, 6, 9, 11, 15, [0, 1500]], cats: [10, 45], catSpd: 155, ice: true,
    haz: [sp(2, 380, 420), sp(5, 1200, 1240), sp(8, 530, 570), sp(10, 1090, 1130), sp(14, 700, 740), sp(16, 1260, 1300), sp(0, 800, 860), sp(0, 1100, 1160)] },
  { name: 'LASER LAB', desc: 'TIME YOUR RUN BETWEEN THE LASER BEAMS',
    time: 125, chicks: [3, 6, 9, 11, 15, [0, 1500]], cats: [10, 40], catSpd: 155,
    haz: [laser(0, 560, 3, 1.6, 0), laser(0, 1000, 3, 1.6, 1.5), laser(2, 400, 2.6, 1.3, 0.4), laser(4, 960, 2.6, 1.3, 1.2), laser(8, 550, 2.8, 1.4, 0.8),
          laser(10, 1110, 2.8, 1.4, 0), laser(15, 990, 2.6, 1.3, 0.5), laser(16, 1280, 2.7, 1.3, 1.6), laser(13, 420, 2.7, 1.3, 0.2)] },
  { name: 'WINDY ROOFTOP', desc: 'GUSTS PUSH YOU AROUND - MIND THE YARN',
    time: 130, chicks: [3, 6, 9, 11, 15, 17, [0, 1500]], cats: [8, 40, 75], catSpd: 160,
    wind: { per: 6, dur: 3.2, f: 120 },
    haz: [ball(0, 150, 1550, 150, 700), ball(4, 870, 1050, 100), ball(10, 1020, 1200, 100), ball(15, 910, 1070, 95)] },
  { name: 'MUDDY SWAMP', desc: 'MUD SLOWS YOU DOWN - SPIKES, YARN AND DRIPS TOO',
    time: 135, chicks: [3, 6, 9, 11, 15, 17, [0, 1500]], cats: [8, 35, 65], catSpd: 160,
    mud: [{ p: 0, a: 450, b: 800 }, { p: 0, a: 1000, b: 1300 }, { p: 2, a: 300, b: 500 }, { p: 4, a: 860, b: 1060 }, { p: 10, a: 1010, b: 1210 }, { p: 14, a: 620, b: 820 }],
    haz: [sp(0, 820, 860), sp(0, 1330, 1380), sp(5, 1200, 1240), sp(13, 420, 460), ball(0, 150, 1550, 140, 1100), ball(4, 880, 1040, 95),
          drop(8, 550, 3, 0.3), drop(11, 1390, 3.2, 1.2), drop(16, 1280, 3, 2)] },
  { name: 'MIDNIGHT FINALE', desc: 'LIGHTS OUT! LASERS, DRIPS, CRUMBLING SHELVES',
    time: 150, chicks: [3, 6, 9, 11, 15, 17, [0, 1500], [0, 900]], cats: [6, 28, 52, 80], catSpd: 165,
    dark: true, crumble: [4, 5, 10, 13, 16],
    haz: [laser(0, 560, 3, 1.6, 0), laser(0, 1000, 3, 1.6, 1.5), laser(8, 550, 2.8, 1.4, 0.8), laser(15, 990, 2.6, 1.3, 0.5), laser(2, 400, 2.6, 1.3, 0.4),
          drop(14, 720, 2.9, 0.5), drop(9, 830, 3, 1.1), drop(7, 260, 3, 0.2), drop(1, 130, 3, 1.6)] }
];

// world-map node positions (screen space) for the 10 levels
const NODE = [[80,330],[180,270],[290,320],[390,255],[495,315],[600,255],[705,310],[720,195],[600,150],[450,115]];

// ---------- cat navigation map ----------
function gapOf(A, B) { return Math.max(0, Math.max(A.x, B.x) - Math.min(A.x + A.w, B.x + B.w)); }
function edgeOpts(A, B) {
  const g = gapOf(A, B), dy = B.y - A.y, opts = [];
  if (dy < -100) return null;
  if (dy < 5) {                                   // same level or up: jump
    if (Math.abs(dy) < 5 && g === 0) return null;
    if (dy < -5 && g === 0) {
      const mid = (Math.max(A.x, B.x) + Math.min(A.x + A.w, B.x + B.w)) / 2;
      const lx = Math.max(A.x + 10, Math.min(A.x + A.w - 10, mid));
      const bc = B.x + B.w / 2;
      opts.push({ x: lx, dir: Math.abs(bc - lx) < 20 ? 0 : Math.sign(bc - lx), act: 'jump' });
    } else if (g <= (dy < -5 ? 50 : 90)) {
      const right = B.x > A.x;
      opts.push({ x: right ? A.x + A.w - 8 : A.x + 8, dir: right ? 1 : -1, act: 'jump' });
    }
  } else {                                        // down: walk off an edge
    const drift = Math.sqrt(2 * dy / G) * ROAM;
    if (B.x < A.x - 15 && (B.x + B.w >= A.x || g <= drift - 5)) opts.push({ x: A.x + 6, dir: -1, act: 'walk' });
    if (B.x + B.w > A.x + A.w + 15 && (B.x <= A.x + A.w || g <= drift - 5)) opts.push({ x: A.x + A.w - 6, dir: 1, act: 'walk' });
  }
  return opts.length ? opts : null;
}
const NAV = (() => {
  const n = PLATS.length;
  const edges = Array.from({ length: n }, () => Array(n).fill(null));
  const next = Array.from({ length: n }, () => Array(n).fill(-1));
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) if (a !== b) edges[a][b] = edgeOpts(PLATS[a], PLATS[b]);
  for (let s = 0; s < n; s++) {                   // breadth-first search: first hop towards every platform
    const seen = Array(n).fill(false), q = [];
    seen[s] = true;
    for (let v = 0; v < n; v++) if (edges[s][v]) { seen[v] = true; next[s][v] = v; q.push(v); }
    while (q.length) {
      const u = q.shift();
      for (let v = 0; v < n; v++) if (!seen[v] && edges[u][v]) { seen[v] = true; next[s][v] = next[s][u]; q.push(v); }
    }
  }
  return { edges, next };
})();

// ---------- state ----------
let state = 'ready';            // ready | map | intro | play | won | over
let player, chicks, follow, hist, cats, spawnT, hz, timeLeft, lp, delivered, need, hintT, camX = 0, msg = '';
let lockT = 0, best = 0, cleared = 0, jumpBuf = 0, lt = 0, total = 0, sel = 0, introT = 0, lvl = 0, L = LEVELS[0], TC = TH[0];
try { best = +localStorage.getItem('cc_best') || 0; cleared = Math.min(10, +localStorage.getItem('cc_clear') || 0); } catch (e) {}
const keys = { left: false, right: false };
const unl = () => Math.min(10, cleared + 1);       // number of playable levels
function save() { try { localStorage.setItem('cc_best', best); localStorage.setItem('cc_clear', cleared); } catch (e) {} }

function reset() {
  player = { x: 400, y: 410, vx: 0, vy: 0, w: 24, h: 22, face: 1, inv: 0, stun: 0, hp: 3, onGround: true, lastPlat: 0 };
  chicks = L.chicks.map((s, i) => {
    const idx = Array.isArray(s) ? s[0] : s, pl = PLATS[idx];
    const x = Array.isArray(s) ? s[1] : (idx === 0 ? 1500 : pl.x + pl.w / 2);
    return { x, y: pl.y - 1, vx: 0, vy: 0, w: 16, h: 14, dir: i % 2 ? 1 : -1, st: 'free', cool: 0, onGround: true, plat: null };
  });
  need = chicks.length;
  follow = []; hist = []; cats = [];
  spawnT = L.cats.map(t => t + Math.random() * 2);   // seconds into the round when each cat appears
  hz = L.haz.map(h => Object.assign({}, h));
  timeLeft = L.time; lp = 0; delivered = 0; hintT = 7; lt = 0; jumpBuf = 0;
  camX = camTarget();
}
function camTarget() { return Math.max(0, Math.min(WW - VW, player.x - VW / 2)); }

// ---------- logic ----------
// entity: x = centre, y = feet
function physics(e, dt) {
  const prev = e.y;
  e.vy += G * dt; e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = Math.max(e.w / 2, Math.min(WW - e.w / 2, e.x));
  e.onGround = false; e.plat = null;
  if (e.vy >= 0) {
    for (const pl of PLATS) {
      if (pl.gone) continue;
      if (e.x + e.w / 2 > pl.x && e.x - e.w / 2 < pl.x + pl.w && prev <= pl.y + 1 && e.y >= pl.y) {
        e.y = pl.y; e.vy = 0; e.onGround = true; e.plat = pl; break;
      }
    }
  }
}
function overlap(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && a.y > b.y - b.h && a.y - a.h < b.y;
}
function finish(win, text) {
  state = win ? 'won' : 'over'; msg = text; lockT = 0.6;
  if (win) {
    total += lp;
    if (total > best) best = total;
    cleared = Math.max(cleared, lvl + 1);
    save();
  }
}

// ----- hazards -----
const DW = 0.9, DS = 520, DH = 110;               // drip warning time, fall speed, fall height
function dropState(h) {
  const c = (lt + h.ph) % h.per, y0 = PLATS[h.p].y - DH, F = DH / DS;
  if (c < DW) return { k: 'warn', a: c / DW, y: y0 };
  if (c < DW + F) return { k: 'fall', a: 1, y: y0 + (c - DW) * DS };
  if (c < DW + F + 0.3) return { k: 'splash', a: (c - DW - F) / 0.3, y: y0 + DH };
  return { k: 'idle', a: 0, y: y0 };
}
function laserOn(h) { return (lt + h.ph) % h.per < h.on; }
function laserWarn(h) { return (lt + h.ph) % h.per > h.per - 0.7; }
function windNow() {
  const w = L.wind; if (!w) return 0;
  const c = lt % w.per;
  if (c >= w.dur) return 0;
  return (Math.floor(lt / w.per) % 2 ? 1 : -1) * w.f;
}
function hazardHit(p) {
  for (const h of hz) {
    const y = PLATS[h.p].y;
    if (h.t === 'spike') {
      if (p.x + p.w / 2 - 4 > h.a && p.x - p.w / 2 + 4 < h.b && p.y > y - 9 && p.y < y + 14) return (h.a + h.b) / 2;
    } else if (h.t === 'ball') {
      if (Math.abs(p.x - h.x) < p.w / 2 + 6 && p.y > y - 16 && p.y - p.h < y) return h.x;
    } else if (h.t === 'drop') {
      const d = dropState(h);
      if (d.k === 'fall' && Math.abs(p.x - h.x) < p.w / 2 + 5 && p.y > d.y - 14 && p.y - p.h < d.y + 4) return h.x;
    } else if (h.t === 'laser') {
      if (laserOn(h) && Math.abs(p.x - h.x) < p.w / 2 + 3 && p.y > y - 62 && p.y - p.h < y) return h.x;
    }
  }
  return null;
}
function hurtHaz(x) {
  const p = player;
  p.hp--; p.inv = 1.6; p.stun = 0.25; p.vy = -380; p.vx = (p.x < x ? -1 : 1) * 200;
  const f = follow.pop();                         // traps only scare off the last chick
  if (f) { f.st = 'free'; f.vy = -250; f.vx = 0; f.cool = 1.2; f.dir = Math.random() < 0.5 ? -1 : 1; }
  if (p.hp <= 0) finish(false, 'OUCH! TRAPPED');
}

// ----- cats -----
function pickRoam(c) {
  c.roamPlat = Math.floor(Math.random() * PLATS.length);
  const pl = PLATS[c.roamPlat];
  c.roamX = pl.x + 14 + Math.random() * (pl.w - 28);
}
function addCat() {
  const c = { x: player.x < WW / 2 ? WW - 40 : 40, y: 410, vx: 0, vy: 0, w: 30, h: 24, dir: -1,
    onGround: false, plat: null, mode: 'roam', cd: 0, alert: 0, wait: 0, roamPlat: 0, roamX: 0 };
  pickRoam(c); cats.push(c);
}
// walk / jump / drop towards a goal platform and x
function navigate(c, goalPlat, goalX, speed) {
  const here = c.plat.i;
  if (here === goalPlat) { c.vx = Math.abs(goalX - c.x) < 6 ? 0 : Math.sign(goalX - c.x) * speed; return; }
  const hop = NAV.next[here][goalPlat];
  if (hop < 0) { c.vx = c.dir * speed * 0.5; if (c.x < 40) c.dir = 1; if (c.x > WW - 40) c.dir = -1; return; }
  const opts = NAV.edges[here][hop];
  let bestO = opts[0];
  for (const o of opts) if (Math.abs(o.x - c.x) < Math.abs(bestO.x - c.x)) bestO = o;
  if (bestO.act === 'walk') {
    const there = bestO.dir < 0 ? c.x <= bestO.x + 6 : c.x >= bestO.x - 6;
    c.vx = there ? bestO.dir * speed : Math.sign(bestO.x - c.x) * speed;
    return;
  }
  const dx = bestO.x - c.x;
  if (Math.abs(dx) > 6) { c.vx = Math.sign(dx) * speed; return; }
  c.vy = CAT_JUMP; c.vx = bestO.dir * CAT_AIR;     // at the launch point: jump
}
function updateCat(c, dt) {
  const p = player;
  c.cd -= dt; c.alert -= dt;
  const d = Math.hypot(p.x - c.x, p.y - c.y);
  if (c.mode === 'roam' && c.cd <= 0 && d < 300) { c.mode = 'chase'; c.alert = 0.9; }
  else if (c.mode === 'chase' && (d > 480 || c.cd > 0)) c.mode = 'roam';
  if (c.onGround && c.plat) {
    if (c.mode === 'chase') navigate(c, p.lastPlat, p.x, CHASE);
    else if (c.wait > 0) { c.wait -= dt; c.vx = 0; }
    else if (c.plat.i === c.roamPlat && Math.abs(c.x - c.roamX) < 8) { c.wait = 0.5 + Math.random() * 1.2; pickRoam(c); c.vx = 0; }
    else navigate(c, c.roamPlat, c.roamX, ROAM);
    if (c.vx) c.dir = c.vx > 0 ? 1 : -1;
  }
  physics(c, dt);
}

function step(dt) {
  if (state !== 'play') return;
  const p = player;
  hintT -= dt; timeLeft -= dt; lt += dt;
  if (timeLeft <= 0) { timeLeft = 0; finish(false, "TIME'S UP"); return; }

  // crumbling platforms: stand too long and they drop away, then come back
  for (const pl of PLATS) if (pl.crumble) {
    if (pl.gone) { pl.goneT -= dt; if (pl.goneT <= 0) { pl.gone = false; pl.stand = 0; } }
    else if (p.plat === pl) { pl.stand += dt; if (pl.stand > 0.7) { pl.gone = true; pl.goneT = 3; } }
    else pl.stand = Math.max(0, pl.stand - dt * 0.5);
  }
  for (const h of hz) if (h.t === 'ball') {         // rolling yarn balls bounce between their ends
    h.x += h.d * h.v * dt;
    if (h.x >= h.b) { h.x = h.b; h.d = -1; } else if (h.x <= h.a) { h.x = h.a; h.d = 1; }
  }

  // player (slower with more chicks in tow, and in mud)
  const ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let spd = MOVE * Math.max(0.75, 1 - 0.05 * follow.length);
  if (L.mud && p.onGround && p.plat) for (const m of L.mud) if (p.plat.i === m.p && p.x > m.a && p.x < m.b) { spd *= 0.5; break; }
  if (p.stun <= 0) {
    const target = ax * spd + windNow();
    if (L.ice && p.onGround) p.vx += (target - p.vx) * Math.min(1, dt * 3);
    else p.vx = target;
    if (ax) p.face = ax;
  }
  jumpBuf -= dt;
  if (jumpBuf > 0 && p.onGround && p.stun <= 0) { p.vy = JUMP; jumpBuf = 0; }
  p.stun -= dt; p.inv -= dt;
  physics(p, dt);
  if (p.plat) p.lastPlat = p.plat.i;
  hist.push({ x: p.x, y: p.y }); if (hist.length > 400) hist.shift();
  camX += (camTarget() - camX) * Math.min(1, dt * 8);

  if (p.inv <= 0) {
    const hx = hazardHit(p);
    if (hx !== null) { hurtHaz(hx); if (state !== 'play') return; }
  }

  // chicks
  for (const c of chicks) {
    if (c.st !== 'free') continue;
    c.cool -= dt;
    c.vx = c.dir * 35;
    physics(c, dt);
    if (c.plat) {
      if (c.x < c.plat.x + 10) c.dir = 1;
      else if (c.x > c.plat.x + c.plat.w - 10) c.dir = -1;
    }
    if (c.cool <= 0 && overlap(p, c)) { c.st = 'follow'; follow.push(c); }
  }
  follow.forEach((c, i) => {
    const h = hist[Math.max(0, hist.length - 1 - (i + 1) * 9)];
    c.x = h.x; c.y = h.y; c.dir = p.face;
  });

  // cats appear on a timer, roam, then hunt when the bird gets close
  const elapsed = L.time - timeLeft;
  while (cats.length < spawnT.length && elapsed >= spawnT[cats.length]) addCat();
  for (const c of cats) {
    updateCat(c, dt);
    if (p.inv <= 0 && overlap(p, c)) {
      p.hp--; p.inv = 1.6; p.stun = 0.25; p.vy = -380; p.vx = (p.x < c.x ? -1 : 1) * 200;
      c.cd = 2; c.mode = 'roam';
      follow.forEach(f => { f.st = 'free'; f.vy = -250; f.vx = 0; f.cool = 1.2; f.dir = Math.random() < 0.5 ? -1 : 1; });
      follow = [];
      if (p.hp <= 0) { finish(false, 'THE CAT GOT YOU'); return; }
    }
  }

  // exit door
  if (follow.length && Math.abs(p.x - DOOR.x) < DOOR.w / 2 + 8 && p.y > DOOR.y - DOOR.h && p.y <= DOOR.y + 6) {
    const n = follow.length;
    delivered += n; lp += n * n * 100;             // bring more at once = bigger score
    follow.forEach(c => { c.st = 'done'; });
    follow = []; chicks = chicks.filter(c => c.st !== 'done');
    if (delivered >= need) {
      lp += Math.ceil(timeLeft) * 10;
      finish(true, lvl === 9 ? 'ALL LEVELS CLEAR!' : 'LEVEL ' + (lvl + 1) + ' CLEAR!');
    }
  }
}

// ---------- level flow ----------
function loadLevel(i) {
  lvl = i; L = LEVELS[i]; TC = TH[i]; CHASE = L.catSpd;
  PLATS.forEach(p => { p.crumble = !!(L.crumble && L.crumble.indexOf(p.i) >= 0); p.stand = 0; p.gone = false; p.goneT = 0; });
  buildBg(TC);
}
function startLevel(i) { loadLevel(i); reset(); state = 'intro'; introT = 2.2; }

// ---------- input ----------
function ui(code) {
  const dir = (code === 'ArrowLeft' || code === 'KeyA') ? -1 : (code === 'ArrowRight' || code === 'KeyD') ? 1 : 0;
  if (state === 'ready') { state = 'map'; sel = unl() - 1; }
  else if (state === 'map') {
    if (dir) sel = Math.max(0, Math.min(unl() - 1, sel + dir));
    else if (code === 'Space' || code === 'Enter' || code === 'ArrowUp' || code === 'KeyW') startLevel(sel);
  }
  else if (state === 'intro') { if (introT < 1.6) introT = 0; }
  else if (state === 'won') { if (lockT <= 0) { sel = Math.min(unl() - 1, lvl < 9 ? lvl + 1 : lvl); state = 'map'; } }
  else if (state === 'over') {
    if (lockT > 0) return;
    if (code === 'KeyM') { sel = lvl; state = 'map'; } else startLevel(lvl);
  }
}
const KM = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
const JK = new Set(['ArrowUp', 'KeyW', 'Space']);
addEventListener('keydown', e => {
  if (KM[e.code] || JK.has(e.code) || e.code === 'Enter' || e.code === 'KeyM') e.preventDefault();
  if (e.repeat) return;
  if (KM[e.code]) keys[KM[e.code]] = true;
  if (state === 'play') { if (JK.has(e.code)) jumpBuf = 0.12; }
  else ui(e.code);
});
addEventListener('keyup', e => { if (KM[e.code]) keys[KM[e.code]] = false; });
addEventListener('blur', () => { keys.left = keys.right = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => {
    e.preventDefault();
    if (k === 'jump') jumpBuf = 0.12; else keys[k] = true;
    if (state !== 'play') ui(k === 'jump' ? 'Space' : k === 'left' ? 'ArrowLeft' : 'ArrowRight');
  };
  const off = e => { e.preventDefault(); if (k !== 'jump') keys[k] = false; };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, off));
});
cv.addEventListener('pointerdown', e => {
  if (state === 'play') return;
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * VW / r.width, my = (e.clientY - r.top) * VH / r.height;
  if (state === 'map') {
    for (let i = 0; i < unl(); i++) {
      if (Math.hypot(mx - NODE[i][0], my - NODE[i][1]) < 28) { if (sel === i) startLevel(i); else sel = i; return; }
    }
    if (my > 365) startLevel(sel);
    return;
  }
  ui('Space');
});

// ---------- drawing (flat-shaded polygons = low-poly look) ----------
function poly(pts, col) {
  cx.fillStyle = col; cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]);

}
function txt(s, x, y, size, col, align) {
  cx.font = 'bold ' + size + 'px "Courier New", monospace'; cx.textAlign = align || 'center';
  cx.fillStyle = '#12082a'; cx.fillText(s, x + 2, y + 2);

function buildBg(th) {

  // windows with curtains
  [230, 700, 1170, 1450].forEach((wx, wi) => {

    P([[wx, y + 170], [wx, y + 30], [wx + 20, y + 8], [wx + 90, y + 8], [wx + 110, y + 30], [wx + 110, y + 170]], th.trim);
    const sky = g.createLinearGradient(0, y + 16, 0, y + 162);
    sky.addColorStop(0, th.sky[0]); sky.addColorStop(0.6, th.sky[1]); sky.addColorStop(1, th.sky[2]);
    g.fillStyle = sky; g.beginPath();
    g.moveTo(wx + 8, y + 162); g.lineTo(wx + 8, y + 34); g.lineTo(wx + 24, y + 16); g.lineTo(wx + 86, y + 16);
    g.lineTo(wx + 102, y + 34); g.lineTo(wx + 102, y + 162); g.closePath(); g.fill();
    if (th.stars) {
      g.fillStyle = 'rgba(255,255,255,.85)';
      for (let k = 0; k < 9; k++) g.fillRect(wx + 14 + ((k * 37 + wi * 11) % 80), y + 22 + ((k * 53 + wi * 7) % 80), 2, 2);
    }
    P([[wx + 8, y + 162], [wx + 40, y + 120], [wx + 70, y + 162]], th.db);
    P([[wx + 50, y + 162], [wx + 80, y + 130], [wx + 102, y + 162]], th.band);
    g.fillStyle = th.trim; g.fillRect(wx + 52, y + 16, 6, 146); g.fillRect(wx + 8, y + 86, 94, 6);
    P([[wx - 16, y], [wx + 18, y], [wx + 6, y + 190], [wx - 16, y + 190]], th.cur);
    P([[wx + 92, y], [wx + 126, y], [wx + 126, y + 190], [wx + 104, y + 190]], th.cur);
    P([[wx - 16, y], [wx + 2, y], [wx - 6, y + 190], [wx - 16, y + 190]], th.cur2);
  });
  // framed pictures
  [470, 940, 1380].forEach(px => {
    P([[px, 210], [px + 64, 210], [px + 64, 258], [px, 258]], th.frame);
    P([[px + 5, 215], [px + 59, 215], [px + 59, 253], [px + 5, 253]], th.band);
    P([[px + 5, 253], [px + 24, 226], [px + 38, 253]], th.cur);
    P([[px + 30, 253], [px + 46, 232], [px + 59, 253]], th.acc);
  });
}

function drawPlat(pl, i, t) {
  const C = TC;
  if (pl.gone) {                                    // faint outline where a crumbled shelf was
    cx.strokeStyle = 'rgba(255,255,255,.28)'; cx.lineWidth = 1; cx.setLineDash([6, 6]);
    cx.strokeRect(pl.x + 0.5, pl.y + 0.5, pl.w - 1, 10); cx.setLineDash([]);
    return;
  }
  if (i === 0) {
    poly([[0, pl.y], [WW, pl.y], [WW, VH], [0, VH]], C.gd);
    for (let x = 0; x < WW; x += 100) poly([[x, pl.y + 10], [x + 50, pl.y + 10], [x + 25, VH]], C.gs);
    poly([[0, pl.y], [WW, pl.y], [WW, pl.y + 10], [0, pl.y + 10]], C.pt);
    if (L.ice) { cx.fillStyle = 'rgba(255,255,255,.55)'; for (let x = 20; x < WW; x += 90) cx.fillRect(x, pl.y + 2, 40, 2); }
    return;
  }
  let top = C.pt, mid = C.pm, low = C.pl, ox = 0;
  if (pl.crumble) { top = '#d9b38c'; mid = '#a9784a'; low = '#7a5230'; if (pl.stand > 0.2) ox = Math.sin(t * 70) * 1.5; }
  cx.save(); cx.translate(ox, 0);
  poly([[pl.x, pl.y], [pl.x + pl.w, pl.y], [pl.x + pl.w, pl.y + 10], [pl.x, pl.y + 10]], top);
  poly([[pl.x, pl.y + 10], [pl.x + pl.w, pl.y + 10], [pl.x + pl.w - 14, pl.y + 28], [pl.x + 14, pl.y + 28]], mid);
  poly([[pl.x + 14, pl.y + 28], [pl.x + pl.w - 14, pl.y + 28], [pl.x + pl.w / 2, pl.y + 40]], low);
  if (L.ice) { cx.fillStyle = 'rgba(255,255,255,.55)'; cx.fillRect(pl.x + 6, pl.y + 2, pl.w - 12, 2); }
  if (pl.crumble) {
    cx.strokeStyle = '#4a2f1a'; cx.lineWidth = 2; cx.beginPath();
    cx.moveTo(pl.x + pl.w * 0.3, pl.y); cx.lineTo(pl.x + pl.w * 0.3 + 5, pl.y + 6); cx.lineTo(pl.x + pl.w * 0.3 - 2, pl.y + 12);
    cx.moveTo(pl.x + pl.w * 0.7, pl.y); cx.lineTo(pl.x + pl.w * 0.7 - 5, pl.y + 7); cx.lineTo(pl.x + pl.w * 0.7 + 2, pl.y + 14);
    cx.stroke();
  }
  cx.restore();
}
function drawHaz(t) {
  if (L.mud) L.mud.forEach(m => {
    const y = PLATS[m.p].y;
    poly([[m.a, y], [m.a + 10, y - 4], [m.b - 10, y - 4], [m.b, y]], '#5a3d22');
    cx.fillStyle = '#7a5530';
    for (let x = m.a + 18; x < m.b - 12; x += 36) cx.fillRect(x, y - 3 - Math.abs(Math.sin(t * 3 + x)) * 3, 3, 3);
  });
  for (const h of hz) {
    const y = PLATS[h.p].y;
    if (h.t === 'spike') {
      for (let x = h.a; x < h.b; x += 10) {
        poly([[x, y], [x + 5, y - 10], [x + 10, y]], '#ff5a6e');
        poly([[x, y], [x + 5, y - 10], [x + 5, y]], '#c93a52');
      }
    } else if (h.t === 'ball') {

      } else if (d.k === 'fall') {

      poly([[h.x - 5, y], [h.x + 5, y], [h.x + 5, y - 4], [h.x - 5, y - 4]], '#3b3b4f');
      poly([[h.x - 5, y - 62], [h.x + 5, y - 62], [h.x + 5, y - 66], [h.x - 5, y - 66]], '#3b3b4f');
      if (laserOn(h)) {
        cx.fillStyle = '#ff2d55'; cx.fillRect(h.x - 3, y - 62, 6, 58);
        cx.fillStyle = '#ffffff'; cx.fillRect(h.x - 1, y - 62, 2, 58);
      } else if (laserWarn(h) && Math.floor(t * 20) % 2) {
        cx.fillStyle = 'rgba(255,45,85,.55)'; cx.fillRect(h.x - 1, y - 62, 2, 58);
      }
    }
  }
}

// mini-map: whole level at a glance (platforms, traps, chicks, cats, exit, your view)

    else if (h2.t === 'laser' || h2.t === 'drop') cx.fillRect(x0 + h2.x * sx - 1, py - 3, 2, 3);
  });
  cx.fillStyle = '#8a4fff'; cx.fillRect(x0 + DOOR.x * sx - 2, y0 + DOOR.y * sy - 5, 4, 6);
  cx.fillStyle = '#ffd23a'; chicks.forEach(c => { if (c.st === 'free') cx.fillRect(x0 + c.x * sx - 1, y0 + c.y * sy - 4, 3, 3); });
  cx.fillStyle = '#ff7a3a'; cats.forEach(c => cx.fillRect(x0 + c.x * sx - 2, y0 + c.y * sy - 4, 4, 4));
  cx.fillStyle = '#7dbcff'; cx.fillRect(x0 + player.x * sx - 2, y0 + player.y * sy - 4, 4, 4);
  cx.strokeStyle = 'rgba(255,255,255,.6)'; cx.lineWidth = 1; cx.strokeRect(x0 + camX * sx, y0, VW * sx, h);
}
function drawWind() {
  const w = L.wind; if (!w) return;
  const c = lt % w.per;
  if (c < w.dur) {
    const dir = Math.floor(lt / w.per) % 2 ? 1 : -1;
    cx.strokeStyle = 'rgba(255,255,255,.45)'; cx.lineWidth = 2;
    for (let i = 0; i < 16; i++) {
      const sp2 = 300 + i * 17, m = VW + 80;
      const x = ((((i * 97 + lt * sp2 * dir) % m) + m) % m) - 40, y = (i * 61) % VH;
      cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + dir * 34, y); cx.stroke();
    }
    txt('WIND ' + (dir > 0 ? '>>>' : '<<<'), VW / 2, 112, 18, '#ffffff');
  } else if (c > w.per - 1) txt('WIND INCOMING', VW / 2, 112, 14, '#ffd23a');
}
function drawHUD() {
  for (let i = 0; i < 3; i++) {
    const x = 20 + i * 26;
    poly([[x, 22], [x + 10, 10], [x + 20, 22], [x + 10, 34]], i < player.hp ? '#ff4d6d' : '#4a2a5a');
  }
  txt('LV ' + (lvl + 1) + ' ' + L.name, 20, 56, 13, TC.txt, 'left');
  txt('SAVED ' + delivered + '/' + need, VW / 2, 30, 20, TC.txt);
  txt('TIME ' + Math.ceil(timeLeft), VW - 20, 30, 20, timeLeft < 15 ? '#ff6b6b' : TC.txt, 'right');
  txt('SCORE ' + (total + lp), VW - 20, 54, 14, '#ffffff', 'right');
  drawMini();
  if (state === 'play' && hintT > 0) txt(L.desc, VW / 2, 436, 15, '#ffffff');
}
function overlay(t, lines, prompt) {
  cx.fillStyle = 'rgba(20,9,46,.72)'; cx.fillRect(0, 0, VW, VH);
  txt(lines.title, VW / 2, 150, 54, '#ffd23a');
  lines.rows.forEach((r, i) => txt(r, VW / 2, 205 + i * 30, 20, '#ffffff'));
  if (Math.sin(t * 5) > -0.3) txt(prompt, VW / 2, 390, 20, '#7dbcff');
}

// world map: pick a level
function drawMap(t) {
  const g = cx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#14092e'); g.addColorStop(1, '#4b2a5e');
  cx.fillStyle = g; cx.fillRect(0, 0, VW, VH);
  for (let i = 0; i < 40; i++) {
    cx.fillStyle = (Math.floor(t * 2 + i) % 3 === 0) ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.4)';
    cx.fillRect((i * 173) % VW, (i * 89) % 260, 2, 2);
  }
  poly([[0, 450], [0, 330], [110, 270], [230, 350], [340, 300], [460, 360], [580, 290], [700, 350], [800, 300], [800, 450]], '#2a1550');
  poly([[0, 450], [0, 390], [140, 340], [300, 400], [460, 370], [620, 410], [800, 370], [800, 450]], '#3a2060');
  txt('CHIRP CHASE MAP', VW / 2, 44, 30, '#ffd23a');
  txt('SCORE ' + total, VW - 20, 30, 16, '#fff3a0', 'right');
  txt('BEST ' + best, VW - 20, 52, 14, '#ffffff', 'right');
  cx.lineWidth = 4; cx.setLineDash([8, 8]);
  for (let i = 0; i < 9; i++) {
    cx.strokeStyle = i + 1 < unl() ? '#ffd23a' : 'rgba(255,255,255,.25)';
    cx.beginPath(); cx.moveTo(NODE[i][0], NODE[i][1]); cx.lineTo(NODE[i + 1][0], NODE[i + 1][1]); cx.stroke();
  }
  cx.setLineDash([]);
  for (let i = 0; i < 10; i++) {
    const nx = NODE[i][0], ny = NODE[i][1], open = i < unl(), th = TH[i], big = i === 9 ? 26 : 20;
    cx.beginPath(); cx.arc(nx, ny, big, 0, Math.PI * 2); cx.fillStyle = open ? th.acc : '#4a2a5a'; cx.fill();
    cx.beginPath(); cx.arc(nx, ny, big - 5, 0, Math.PI * 2); cx.fillStyle = '#14092e'; cx.fill();
    txt(open ? String(i + 1) : '?', nx, ny + 6, 16, open ? th.txt : '#7a5a8a');
    if (i < cleared) poly([[nx + 16, ny - 24], [nx + 22, ny - 16], [nx + 16, ny - 8], [nx + 10, ny - 16]], '#ffd23a');
  }
  const sx = NODE[sel][0], sy = NODE[sel][1];
  cx.strokeStyle = '#ffffff'; cx.lineWidth = 3; cx.beginPath(); cx.arc(sx, sy, (sel === 9 ? 30 : 25) + Math.sin(t * 6) * 2, 0, Math.PI * 2); cx.stroke();
  cx.save(); cx.translate(sx, sy - 34 - Math.abs(Math.sin(t * 5)) * 8); cx.scale(1.3, 1.3); drawBird(); cx.restore();
  const Ls = LEVELS[sel], th = TH[sel];
  cx.fillStyle = 'rgba(20,9,46,.88)'; cx.fillRect(40, 372, 720, 68);
  cx.strokeStyle = th.acc; cx.lineWidth = 2; cx.strokeRect(40, 372, 720, 68);
  txt('LEVEL ' + (sel + 1) + '  ' + Ls.name, VW / 2, 396, 20, '#ffd23a');
  txt(Ls.desc, VW / 2, 418, 14, '#ffffff');
  txt('CHICKS ' + Ls.chicks.length + '   CATS ' + Ls.cats.length + '   TIME ' + Ls.time + 'S', VW / 2, 435, 13, '#7dbcff');
  if (Math.sin(t * 5) > -0.3) txt('LEFT / RIGHT CHOOSE    SPACE OR TAP TO START', VW / 2, 346, 14, '#ffffff');
}

function draw(t) {
  if (state === 'map') { drawMap(t); return; }
  cx.save();
  cx.translate(-Math.round(camX), 0);
  cx.drawImage(bg, 0, 0);
  drawDoor(t);
  PLATS.forEach((pl, i) => drawPlat(pl, i, t));
  drawHaz(t);
  chicks.filter(c => c.st === 'free').forEach(c => at(c, c.dir, drawChick));
  chicks.filter(c => c.st === 'follow').forEach(c => at(c, c.dir, drawChick));
  cats.forEach(c => {
    at(c, c.dir, drawCat);
    if (c.alert > 0) txt('!', c.x, c.y - 34, 24, '#ff4d6d');
  });
  if (!(player.inv > 0 && Math.floor(t * 12) % 2)) at(player, player.face, drawBird);
  cx.restore();
  drawWind();
  if (L.dark) {                                      // lights out: only a small circle around the bird is visible
    const px = player.x - camX, py = player.y - 12;
    const dg = cx.createRadialGradient(px, py, 30, px, py, 190);
    dg.addColorStop(0, 'rgba(8,3,20,0)'); dg.addColorStop(1, 'rgba(8,3,20,0.94)');
    cx.fillStyle = dg; cx.fillRect(0, 0, VW, VH);
  }
  drawHUD();
  if (state === 'ready') {
    overlay(t, { title: 'CHIRP CHASE', rows: ['GRAB THE LOST CHICKS', 'LEAD THEM TO THE EXIT', 'DODGE THE CATS AND TRAPS', '10 LEVELS TO CLEAR', 'ARROWS / WASD MOVE    SPACE JUMP'] },
      'PRESS ANY KEY OR TAP TO START');
  } else if (state === 'intro') {
    cx.fillStyle = 'rgba(20,9,46,.65)'; cx.fillRect(0, 120, VW, 200);
    txt('LEVEL ' + (lvl + 1), VW / 2, 180, 28, TC.acc);
    txt(L.name, VW / 2, 232, 44, '#ffd23a');
    txt(L.desc, VW / 2, 272, 16, '#ffffff');
    txt('GET READY...', VW / 2, 306, 18, '#7dbcff');
  } else if (state === 'won') {
    overlay(t, { title: msg, rows: ['LEVEL SCORE ' + lp, 'TOTAL ' + total, 'BEST ' + best] },
      lockT > 0 ? '' : 'PRESS ANY KEY FOR THE MAP');
  } else if (state === 'over') {
    overlay(t, { title: msg, rows: ['LEVEL ' + (lvl + 1) + '  ' + L.name, 'BEST ' + best] },
      lockT > 0 ? '' : 'ANY KEY: RETRY    M: MAP');
  }
}

// ---------- main loop ----------
let last = 0, acc = 0;
function loop(ts) {
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts;
  if (state === 'intro') { introT -= dt; if (introT <= 0) state = 'play'; }
  acc += dt; while (acc >= STEP) { step(STEP); acc -= STEP; }
  lockT = Math.max(0, lockT - dt);
  draw(ts / 1000);
  requestAnimationFrame(loop);
}
loadLevel(0);
reset();
requestAnimationFrame(loop);
})();
</script>
